# Publishes a release built on GitHub's own machines, with a build attestation so anyone
# can check a download came from this repository:
#   gh attestation verify SKey-1.2.3.dmg -R SLyHuy/SKey
#
# Usual way: Actions → Release → Run workflow on master, pick patch / minor / major.
# The next version is worked out from the latest v* tag; the tag is created by the
# release itself, so no version-bump commit is needed. Pushing a v1.2.3 tag by hand
# also works.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the tag and the GitHub Release
  id-token: write      # sign the build attestation
  attestations: write  # store the build attestation

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # all tags and history: version and build number come from them

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "Run the release from master, not $GITHUB_REF" >&2
              exit 1
            fi
            LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-v0.0.0}"
            MAJOR="${MAJOR#v}"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "Tag v$VERSION already exists" >&2
              exit 1
            fi
            echo "Latest release ${LATEST:-none} → $BUMP → v$VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Test, build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          brew install xcodegen
          ./scripts/release.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_ARGS=(--verify-tag)             # the pushed tag already exists
          else
            TAG_ARGS=(--target "$GITHUB_SHA")   # create the tag on the commit just built
          fi
          gh release create "v$VERSION" \
            "dist/SKey-$VERSION.dmg" "dist/SKey-$VERSION.zip" "dist/SKey-$VERSION.sha256" \
            --title "SKey $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${TAG_ARGS[@]}"
