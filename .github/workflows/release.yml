# Builds a release on GitHub's own machines when a version tag (v1.2.3) is pushed, attests
# where the files came from, and publishes them. Anyone can then check that a download
# was built from this repository:
#   gh attestation verify SKey-1.2.3.dmg -R SLyHuy/SKey
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the GitHub Release
  id-token: write      # sign the build attestation
  attestations: write  # store the build attestation

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Test, build and package
        run: |
          brew install xcodegen
          ./scripts/release.sh

      - name: Check the tag matches the app version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "dist/SKey-$VERSION.dmg" || {
            echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION in project.yml" >&2
            exit 1
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            "dist/SKey-$VERSION.dmg" "dist/SKey-$VERSION.zip" "dist/SKey-$VERSION.sha256" \
            --title "SKey $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
