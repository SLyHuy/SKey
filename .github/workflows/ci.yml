# Runs the engine tests and builds the app for every pull request and every push to
# master. Branch protection requires this check before a pull request can be merged.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Engine tests
        working-directory: Packages/SKeyEngine
        run: swift test

      - name: Install XcodeGen (pinned, checksum verified)
        run: ./scripts/install-xcodegen.sh

      - name: Build the app
        run: |
          xcodegen generate
          xcodebuild -project SKey.xcodeproj -scheme SKey -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData build
