name: SKey
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The real version comes from the release tag: scripts/release.sh passes it to
    # xcodebuild. These defaults only show up in builds made straight from Xcode.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  SKeyEngine:
    path: Packages/SKeyEngine
targets:
  SKey:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: App
    dependencies:
      - package: SKeyEngine
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  SKey:
    build:
      targets:
        SKey: all
    run:
      config: Debug
    archive:
      config: Release
